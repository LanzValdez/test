name: PR -> Store in Dynamo

on:
  pull_request:
    branches: [dev, stage, prod]   # base branch (merged INTO)
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]

jobs:
  send_pr_event:
    runs-on: ubuntu-latest
    steps:
      - name: POST PR payload to API Gateway
        env:
          ENDPOINT: https://xiztysz760.execute-api.ap-southeast-1.amazonaws.com/dev/test-runs
          GH_EVENT: ${{ toJson(github.event) }}
        run: |
          echo "$GH_EVENT" > payload.json
          echo "POST $ENDPOINT"

          # show status + response
          curl -i -sS -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
